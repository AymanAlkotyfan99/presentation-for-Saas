name: Upload Release to R2

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: sync_r2

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir assets
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag has an unsupported version format: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --dir assets \
            --pattern '*.deb' --pattern '*.dmg' --pattern '*.exe' --pattern 'SHA256SUMS'

          mapfile -t RELEASE_ASSETS < <(find assets -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' \) -printf '%f\n' | sort)
          if (( ${#RELEASE_ASSETS[@]} == 0 )); then
            echo "The release contains no supported desktop assets." >&2
            exit 1
          fi
          test -s assets/SHA256SUMS

          for asset in "${RELEASE_ASSETS[@]}"; do
            if [[ ! "$asset" =~ ^Presenton-${VERSION}([._-][0-9A-Za-z._-]+)?\.(deb|dmg|exe)$ ]]; then
              echo "Malformed or version-mismatched release asset: $asset" >&2
              exit 1
            fi
            if ! grep -Eq "^[[:xdigit:]]{64}[[:space:]]+[*]?${asset}$" assets/SHA256SUMS; then
              echo "SHA256SUMS does not cover release asset: $asset" >&2
              exit 1
            fi
          done

          (cd assets && sha256sum --check --strict SHA256SUMS)
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      # GitHub-hosted runners include the AWS CLI. Avoid executing an unverified
      # remote installer and avoid persisting R2 credentials in a config file.
      - name: Upload files to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws --version
          aws s3 cp assets "s3://presenton-desktop/${VERSION}/" \
            --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
