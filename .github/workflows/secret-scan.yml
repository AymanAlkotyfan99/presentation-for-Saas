name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tracked-files:
    name: Scan tracked files
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned so a mutable action tag cannot change
      # the code that receives access to this repository.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan for production-shaped credentials
        run: |
          python3 -m unittest scripts/tests/test_scan_secrets.py
          python3 scripts/scan_secrets.py
