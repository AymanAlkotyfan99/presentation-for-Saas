name: bayanly-validation

services:
  postgres:
    image: postgres:16-alpine
    container_name: bayanly-validation-postgres
    environment:
      POSTGRES_USER: bayanly_validation
      POSTGRES_PASSWORD: ${BAYANLY_VALIDATION_POSTGRES_PASSWORD:?Set BAYANLY_VALIDATION_POSTGRES_PASSWORD for the isolated validation stack}
      POSTGRES_DB: bayanly_integration
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayanly_validation -d bayanly_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - bayanly_validation_postgres:/var/lib/postgresql/data
    networks: [bayanly_validation]
    labels:
      com.bayanly.purpose: integration-validation

  redis:
    image: redis:7-alpine
    container_name: bayanly-validation-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - bayanly_validation_redis:/data
    networks: [bayanly_validation]
    labels:
      com.bayanly.purpose: integration-validation

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: bayanly-validation-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bayanly_validation
      MINIO_ROOT_PASSWORD: ${BAYANLY_VALIDATION_MINIO_PASSWORD:?Set BAYANLY_VALIDATION_MINIO_PASSWORD for the isolated validation stack}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - bayanly_validation_minio:/data
    networks: [bayanly_validation]
    labels:
      com.bayanly.purpose: integration-validation

networks:
  bayanly_validation:
    name: bayanly-validation
    labels:
      com.bayanly.purpose: integration-validation

volumes:
  bayanly_validation_postgres:
    name: bayanly-validation-postgres
    labels:
      com.bayanly.purpose: integration-validation
  bayanly_validation_redis:
    name: bayanly-validation-redis
    labels:
      com.bayanly.purpose: integration-validation
  bayanly_validation_minio:
    name: bayanly-validation-minio
    labels:
      com.bayanly.purpose: integration-validation
